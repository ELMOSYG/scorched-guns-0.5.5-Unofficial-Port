# Gradle build settings (port: Scorched Guns 0.5.5 -> MC 1.21.1 / NeoForge)
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment parameter mappings for 1.21.1
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Dev/compile target. Kept at the newest 21.1.x this port was developed and tested against, because the
# integration mods loaded in dev runs (Create 6.0.10 needs 21.1.219, Sable 21.1.228, ...) refuse to load
# on older NeoForge.
neo_version=21.1.249
# What players actually need. This range is written verbatim into the shipped neoforge.mods.toml, and
# 21.1.150 is the lowest version this mod can load on at all: GeckoLib 4.9.3 - a REQUIRED dependency -
# declares `neoforge [21.1.150,)` with type="required", so below that NeoForge refuses to load GeckoLib
# and the mod never runs no matter what we ask for. Framework only asks [21.1,), Curios [21.1.60,), so
# GeckoLib is the binding constraint. Verified by compiling the whole tree against 21.1.150 and booting a
# dedicated server on it - see tools/check_neoforge_api_floor.py and HANDOFF section 70.
neo_version_range=[21.1.150,)
loader_version_range=[1,)

## Mod properties
## mod_version is the PORT's own version, and it carries both halves: "0.5.5" is the upstream Scorched
## Guns release this port is built from, and "v1.0.2" is this port's own version. It is the single source
## for the version everywhere: it names the jar (build/libs/scguns-<version>.jar), it is what
## src/main/templates/META-INF/neoforge.mods.toml and maid-compat's own template report through
## ${mod_version}, tools/install_jar.py takes the jar name from it, and tools/verify_installed_jar.py
## checks the packaged value against it - so bump it here and nowhere else.
##
## Two things to keep in mind when bumping:
##   * maid-compat declares a required dependency on scguns with versionRange="[0.5.0,)" (see its
##     template). FML compares that Maven-style, so "0.5.5-v1.0.2" still satisfies it - the numeric
##     parts 0.5.5 beat 0.5.0 before any qualifier is looked at. Changing the *upstream* half below
##     0.5.0 would break it, and a strict-semver reader would treat "-v1.0.2" as a pre-release.
##   * the jar is renamed by the version, so install_jar.py backs up and removes the previous
##     scguns-*.jar in the instance. Leaving both would be two copies of one mod id, which is a load
##     error rather than a harmless leftover.
mod_id=scguns
mod_name=Scorched Guns
mod_license=GPL-3.0-or-later
mod_version=0.5.5-v1.0.2
mod_group_id=top.ribs
mod_authors=ribs
mod_credits=MrCrayfish, Ribs
mod_description=SCORCHED GUNSSSSS
