# Gradle build settings (port: Scorched Guns 0.5.5 -> MC 1.21.1 / NeoForge)
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment parameter mappings for 1.21.1
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Dev/compile target. Kept at the newest 21.1.x this port was developed and tested against, because the
# integration mods loaded in dev runs (Create 6.0.10 needs 21.1.219, Sable 21.1.228, ...) refuse to load
# on older NeoForge.
neo_version=21.1.249
# What players actually need. This range is written verbatim into the shipped neoforge.mods.toml, and
# 21.1.150 is the lowest version this mod can load on at all: GeckoLib 4.9.3 - a REQUIRED dependency -
# declares `neoforge [21.1.150,)` with type="required", so below that NeoForge refuses to load GeckoLib
# and the mod never runs no matter what we ask for. Framework only asks [21.1,), Curios [21.1.60,), so
# GeckoLib is the binding constraint. Verified by compiling the whole tree against 21.1.150 and booting a
# dedicated server on it - see tools/check_neoforge_api_floor.py and HANDOFF section 70.
neo_version_range=[21.1.150,)
loader_version_range=[1,)

## Mod properties
## mod_version is the PORT's own version, and it no longer shares a number line with upstream: this port
## is its own product, so it starts at 1.0.0 and moves on its own schedule. The upstream release it is based
## on is recorded separately in upstream_version and is quoted in the mod description, so players can still
## see which Scorched Guns release a build corresponds to.
##
## This is the single source for the version everywhere: it names the jar (build/libs/scguns-<version>.jar),
## it is expanded into both mods.toml files through ${mod_version}, tools/install_jar.py takes the jar name
## from it, and tools/verify_installed_jar.py checks the installed jar against it.
##
##   * the jar is renamed by the version, so install_jar.py backs up and removes the previous
##     scguns-*.jar from the instance (two copies of one mod id would crash the game)
##
## upstream_version is documentation only - nothing is derived from it.
mod_id=scguns
# The upstream Scorched Guns release this port is based on (documentation only).
upstream_version=0.5.5
mod_id=scguns
mod_name=Scorched Guns
mod_license=GPL-3.0-or-later
## Two versions on purpose.
##
## port_version is this port's own product version: it names the jar (build/libs/scguns-<port_version>.jar), it
## is what the changelog and the docs quote, and tools/install_jar.py and tools/verify_installed_jar.py read it.
##
## compat_version is what the mod loader compares against other mods' dependency ranges. Addons built for other
## Scorched Guns ports ask for ranges like [0.5.0,), [0.5.5,), [1.2.0,) or [1.5,1.6). Those are Maven ranges and
## are decided by the string in neoforge.mods.toml, before any of our code runs, so it is the only lever there
## is. A single 1.5.0 satisfies every range seen so far; mod_version carries both numbers so the manifest still
## says which port build this is: "1.5.0+1.0.3" reads as "presents as 1.5.0, is port 1.0.3".
##
## The build sets the Gradle project version (and so the jar name) from port_version, and expands mod_version
## into neoforge.mods.toml. Keep compat_version pinned unless a range genuinely needs a different floor.
port_version=1.0.6
compat_version=1.5.0
mod_version=1.5.0+1.0.6
mod_group_id=top.ribs
mod_authors=ribs
mod_credits=MrCrayfish, Ribs
mod_description=SCORCHED GUNSSSSS
